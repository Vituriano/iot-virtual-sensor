# Apenas desenvolvimento local: sem autenticação, sem TLS.
listener 1883
allow_anonymous true
max_packet_size 10000000

# Ao (re)assinar rmr/chuva/+, a Platform recebe de uma vez a leitura retida
# de cada um dos 3.210 sensores. O padrão do Mosquitto (fila de 1000 por
# cliente) descartava o resto em silêncio: só ~1040 células voltavam
# depois de um restart (ver docs/testes.md, E5).
max_queued_messages 10000

# Guarda as mensagens retidas em disco: um restart do broker não apaga a
# última leitura de cada sensor.
persistence true
persistence_location /mosquitto/data/
